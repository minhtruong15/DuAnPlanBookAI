version: '3.8'

# Định nghĩa 3 dịch vụ chạy đồng thời của hệ thống PlanbookAI (PBA)
services:
  # 1. Dịch vụ Cơ sở dữ liệu quan hệ MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: pba_mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: planbookai_db
    ports:
      - "3306:3306"
    volumes:
      - pba_mysql_data:/var/lib/mysql
    networks:
      - pba-network

  # 2. Dịch vụ Máy chủ Backend RESTful API (Node.js + Express + Prisma)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pba_backend_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "mysql://root:rootpassword123@mysql:3306/planbookai_db"
      JWT_SECRET: "planbookai_super_secret_jwt_key_2026"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      SUPABASE_URL: "${SUPABASE_URL}"
      SUPABASE_KEY: "${SUPABASE_KEY}"
    depends_on:
      - mysql
    networks:
      - pba-network

  # 3. Dịch vụ Giao diện Cổng công cụ Web Frontend (ReactJS + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pba_frontend_web
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: "http://localhost:5000/api"
    depends_on:
      - backend
    networks:
      - pba-network

# Khai báo ổ đĩa lưu trữ dữ liệu MySQL bền vững
volumes:
  pba_mysql_data:

# Khai báo mạng nội bộ kết nối 3 dịch vụ MySQL <-> Backend <-> Frontend
networks:
  pba-network:
    driver: bridge